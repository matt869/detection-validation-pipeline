# ATT&CK reference subset
#
# This is the join table between adversary techniques, the tactics they serve,
# and the telemetry sources that can observe them. Three consumers:
#
#   * the linter, to reject typo'd or deprecated technique ids
#   * the coverage report, to know what "complete" would look like
#   * the gap analyser, to say *which log source* would close a blind spot
#
# Only techniques the library targets (and their parents) are listed. Refresh
# against a new ATT&CK release with `dvp mapping check`, which reports rules
# referencing ids that are absent here.

version: 1
attack_version: "v16.1"
generated_note: >-
  Curated subset, not a full ATT&CK export. `telemetry` lists the sources in
  mapping/telemetry_sources.yml that can observe the technique in this estate.

