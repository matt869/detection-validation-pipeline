# Rule template - copy, do not edit in place.
# Every key supported by rulekit is shown; delete what you do not need.

# Stable UUID. Generate with: python -c "import uuid; print(uuid.uuid4())"
id: 00000000-0000-4000-8000-000000000000
# Optional. Defaults to the filename stem; keep them identical.
name: example_rule_name
title: Short imperative description of the behaviour
# experimental | test | production | deprecated | unsupported
status: experimental
# informational | low | medium | high | critical
severity: medium
description: >-
  What the behaviour is, why it is suspicious in this estate, and the first
  thing a responder should check. Two sentences minimum.
author: detection-engineering
date: 2026-01-01
modified: 2026-01-01
references:
  - https://attack.mitre.org/techniques/T1059/001/

attack:
  tactics: [execution]
  techniques: [T1059.001]

platforms: [windows]

# Sigma-compatible, informational. Query scoping comes from `telemetry:`.
logsource:
  product: windows
  service: sysmon
  category: process_creation

# Ids from mapping/telemetry_sources.yml. Required: this is what lets the
# harness distinguish a detection gap from a visibility gap.
telemetry:
  - sysmon_process_creation

detection:
  selection:
    EventID: 1
    Image|endswith: '\example.exe'
    CommandLine|contains:
      - 'suspicious-argument'
  # Always present, even when empty of entries: tuning hangs here so that
  # updating the detection logic never clobbers local exceptions.
  filter_known_good:
    ParentImage|endswith:
      - '\ccmexec.exe'
  condition: selection and not filter_known_good

# Surfaced in the alert. Order matters - most useful first.
fields:
  - Computer
  - User
  - Image
  - CommandLine
  - ParentImage

falsepositives:
  - Describe each one, and how a responder tells it apart from the real thing.

validation:
  # Test ids from fixtures/emulation/*.yml
  emulation:
    - T1059.001-example-test
  # detected (default) | visible | blind
  expect: detected
  # Detection latency budget.
  max_latency: 5m
  enabled: true
  # Required when expect is not `detected`.
  justification: ""
  owner: detection-engineering

tuning:
  baseline_profile: windows-workstation
  expected_daily_volume: 2
  notes:
    - Free-form notes for the analyst tuning this rule.

tags:
  - purple-team
