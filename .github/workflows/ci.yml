# The `pr-smoke` job from scheduler/jobs.yml, expressed for GitHub Actions.
#
# Nothing here reaches a SIEM, executes emulation, or needs a secret: the whole
# pipeline runs against the recorded corpora in fixtures/, so this gate cannot
# be flaky and is safe to require on a fork's pull request.
#
# Job order mirrors `make ci`. Content checks run first because a broken rule
# is the more common failure and the faster signal - there is no point running
# a validation pass over content that does not parse.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch supersedes the first; there is nothing to
# learn from a run against a commit that is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  content:
    name: detection content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install -e .

      # Every dialect the repository ships. A rule that compiles for the
      # fixture backend but not for Splunk is broken for the estate that
      # actually runs it, so all three are required, not just the one CI uses.
      - name: Lint rules against every shipped dialect
        run: dvp rules lint --dialect fixture --dialect splunk --dialect elastic

      - name: Score rule quality
        run: dvp rules score

      - name: Check configuration and content
        run: dvp doctor

      # The schedule lives in scheduler/jobs.yml; the units on disk are
      # generated from it. Edit one without re-rendering the other and a host
      # keeps running yesterday's schedule.
      - name: Check the systemd drop-ins match the manifest
        run: python scripts/render_systemd.py --check

  code:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Type-check
        run: mypy harness rulekit

      - name: Test
        run: pytest -q

  validate:
    name: offline validation
    runs-on: ubuntu-latest
    needs: [content]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install -e .

      # Exit codes are the point of this step. `dvp` distinguishes "detections
      # regressed" (1) from "the pipeline itself broke" (2-8), and CI should
      # say which one happened rather than reporting a generic red cross. Both
      # fail the build - fail_build_on: [regression, error] in jobs.yml - but
      # only one of them is a content problem for the author to fix.
      - name: Run the quick-smoke profile
        id: run
        run: |
          set +e
          dvp --log-format json run \
            --profile quick-smoke \
            --format json --format junit --format markdown \
            --output artifacts
          code=$?
          set -e
          case "$code" in
            0) echo "all gates satisfied" ;;
            1) echo "::error title=Detection gate failed::A validation gate failed - a detection regressed, or coverage fell below target. See the run summary." ;;
            *) echo "::error title=Pipeline error::dvp exited $code: the pipeline failed to complete, which says nothing about the detections. See docs/architecture.md#exit-codes." ;;
          esac
          exit "$code"

      # The markdown report is written for humans, so put it where a reviewer
      # already looks instead of making them download an artifact.
      - name: Publish the report to the job summary
        if: always()
        run: |
          report=$(find artifacts -name report.md -print -quit 2>/dev/null || true)
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was produced - the run did not reach the reporting stage." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-run
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
