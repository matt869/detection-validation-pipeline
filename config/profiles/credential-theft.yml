# Credential access chain.
#
# The highest-priority tactic in this estate's threat model: every intrusion we
# have handled pivoted on stolen credentials, so the targets here are the
# strictest in mapping/coverage_targets.yml.
#
# Against a live backend this needs an authorised lab:
#   dvp run --profile credential-theft --backend splunk --execute

name: credential-theft
description: >-
  Validate the credential access chain end to end - LSASS memory, registry
  hive export, and the living-off-the-land variants that avoid both.
owner: detection-engineering

select:
  tactics: [credential-access]
  statuses: [production, test]

scenarios:
  - credential-theft
  - baseline

timing:
  # Sysmon ProcessAccess is high volume; indexing lags more than process
  # creation does on this platform.
  ingest_lag: 90s
  max_wait: 8m
  poll_interval: 20s
  inter_test_delay: 30s

gates:
  # Credential access is where a blind spot costs the most, so visibility is
  # asserted absolutely while detection is allowed one miss.
  min_visibility_rate: 100%
  min_detection_rate: 90%
  fail_on_regression: true
  fail_on_latency_breach: true
  fail_on_coverage_target: true
  min_severity: high

formats:
  - json
  - markdown
  - html
  - navigator

tags:
  - purple-team
  - scheduled
