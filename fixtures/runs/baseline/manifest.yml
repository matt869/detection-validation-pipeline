scenario: baseline
description: >-
  An hour of ordinary estate activity with no emulation running. Every event
  here is tagged `__baseline__` and is anchored to the quiet window sampled
  before a run, never to an emulation test.

  Its purpose is adversarial: a rule that matches anything in this corpus is
  producing noise, and the harness records that as a distinct finding from the
  detection outcome. A rule can be DETECTED and noisy at the same time - and a
  rule that is both is not a working control, it is an alert generator.

  The Teams autostart entry is deliberately included. run_key_persistence
  matches it, which is a true finding: that rule needs tuning before it can be
  trusted at the volume its own metadata predicts.
