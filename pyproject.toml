[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-validation-pipeline"
version = "0.1.0"
description = "Continuously validate SIEM/EDR detections against emulated adversary behaviour using a three-state outcome model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Detection Engineering" }]
keywords = ["detection-engineering", "purple-team", "sigma", "attack", "validation", "siem"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

# The core runtime is deliberately thin: YAML is the only hard dependency.
# Everything else is optional and degrades with an actionable error message.
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Live SIEM/EDR backends (Splunk, Elasticsearch, Sentinel). Everything else -
# rule linting, offline validation, reporting and the dashboard - runs on the
# standard library plus PyYAML.
live = ["httpx>=0.27"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
dvp = "harness.cli:main"

[project.urls]
Documentation = "https://github.com/example/detection-validation-pipeline/tree/main/docs"
Source = "https://github.com/example/detection-validation-pipeline"

[tool.setuptools]
packages = [
  "harness",
  "harness.core",
  "harness.backends",
  "harness.emulation",
  "harness.analysis",
  "harness.reporting",
  "rulekit",
  "rulekit.linters",
  "rulekit.scorecard",
  "dashboard",
  "dashboard.app",
]

[tool.setuptools.package-data]
"harness.reporting" = ["templates/*"]
"dashboard" = ["templates/*", "static/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that take more than a second",
  "live: tests that require a reachable SIEM backend (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["fixtures/runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "E501",
  # `class X(str, Enum)` rather than `StrEnum`. Deliberate: these enums are
  # serialised straight into JSON, SQLite and report templates, and the mixin
  # form keeps `str(x)`, `x.value` and `json.dumps` behaving identically across
  # the interpreter versions this has to run on.
  "UP042",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "(^build/|^dist/)"

[tool.coverage.run]
branch = true
source = ["harness", "rulekit"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
